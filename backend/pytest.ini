[pytest]
# Pytest configuration for isolated test environment
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
markers =
    sqlite: SQLite-compatible tests (run with in-memory database)
    postgres: PostgreSQL-specific tests (skipped by default)
    antifraude: Antifraude security validation tests
    integration: Integration tests (may require external services)
    rate_limit: Rate limiting tests
